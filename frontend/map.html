<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图功能</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/all.min.css">
    <script src="/static/js/amap/AMap3.js"></script>
    <script src="/static/js/xlsx.full.min.js"></script>
    <style>
        .map-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 120px);
            margin-top: 60px;
        }
        .map-controls {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            gap: 10px;
            background: white;
            padding: 15px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .map-controls button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .map-controls button:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }
        .map-controls button i {
            font-size: 16px;
        }
        .gps-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            max-width: 300px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        .gps-preview table {
            width: 100%;
            border-collapse: collapse;
        }
        .gps-preview th, .gps-preview td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .gps-preview th {
            background: #f8f9fa;
            font-weight: bold;
        }
        .gps-preview .close-preview {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            color: #666;
        }
        .gps-preview .preview-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .gps-preview .preview-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .gps-preview .preview-actions .confirm-btn {
            background: #2ecc71;
            color: white;
        }
        .gps-preview .preview-actions .confirm-btn:hover {
            background: #27ae60;
        }
        .gps-preview .preview-actions .cancel-btn {
            background: #e74c3c;
            color: white;
        }
        .gps-preview .preview-actions .cancel-btn:hover {
            background: #c0392b;
        }
        #map-container {
            width: 100%;
            height: 100%;
        }
        .back-home-btn {
            padding: 6px 12px;
            border: 1px solid #3498db;
            border-radius: 4px;
            background: transparent;
            color: #3498db;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-home-btn:hover {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">地图功能</div>
        <div class="navbar-user">
            <button class="back-home-btn" onclick="window.location.href='/index'">
                <i class="fas fa-home"></i>返回主页
            </button>
            <span class="welcome-text">欢迎，<span id="username"></span></span>
            <button id="logout-btn" class="btn-outline-danger">退出</button>
        </div>
    </nav>

    <div class="map-controls">
        <button id="import-gps-btn" class="btn">批量导入GPS</button>
    </div>

    <div class="map-container">
        <div id="map-container"></div>

        <div class="gps-preview" id="gps-preview">
            <div class="close-preview">
                <i class="fas fa-times"></i>
            </div>
            <h3>GPS数据预览</h3>
            <div id="preview-content"></div>
            <div class="preview-actions">
                <button class="confirm-btn">确认导入</button>
                <button class="cancel-btn">取消</button>
            </div>
        </div>
    </div>

    <script src="/static/js/amap/AMap3.js"></script>
    <script src="/static/js/amap/mapsplugin.js"></script>
    <script src="/static/js/xlsx.full.min.js"></script>
    <script src="/static/js/map.js"></script>
    <script>
        // 等待高德地图API加载完成
        window.onload = async function() {
            // 获取并显示用户名
            const username = localStorage.getItem('username');
            if (username) {
                document.getElementById('username').textContent = username;
            } else {
                // 如果未登录，跳转到登录页
                window.location.href = '/login';
                return;
            }

            try {
                // 配置离线地图
                window.AMap.Config = {
                    offline: true,
                    version: '2.0.1',
                    path: '/static/js/amap/',  // 指向本地AMap文件目录
                    baseUrl: '/static/js/MAP_zxy/',
                    maxZoom: 12,  // 最大缩放级别为12
                    disableOnline: true,
                    disableApi: true,  // 禁用API加载
                    disableUI: true,   // 禁用UI组件加载
                    disablePlugin: true, // 禁用插件加载
                    disableMapUI: true,  // 禁用地图UI
                    disableMapControl: true, // 禁用地图控件
                    disableMapToolbar: true, // 禁用地图工具栏
                    disableMapStatus: true,  // 禁用地图状态栏
                    disableMapLogo: true,    // 禁用地图Logo
                    disableMapScale: true,   // 禁用地图比例尺
                    disableMapZoom: true,    // 禁用地图缩放控件
                    disableMapPan: true,     // 禁用地图平移控件
                    disableMapRotate: true,  // 禁用地图旋转控件
                    disableMapPitch: true,   // 禁用地图倾斜控件
                    disableMapCompass: true, // 禁用地图指南针
                    disableMapOverview: true,  // 禁用地图鹰眼
                    imageamap: '/static/js/amap/',  // 添加imageamap路径配置
                    mapamap: '/static/js/amap/'     // 添加mapamap路径配置
                };
                
                // 重写AMap.plugin方法，阻止在线加载
                window.AMap.plugin = function(plugins, callback) {
                    if (callback) callback();
                };
                
                // 重写AMap.load方法，阻止在线加载
                window.AMap.load = function(plugins, callback) {
                    if (callback) callback();
                };
                
                // 重写资源加载方法，使用本地2.0.1文件
                window.AMap.Wn = {
                    fn: function() {
                        return Promise.resolve('/static/js/amap/2.0.1');
                    }
                };
                
                // 重写AMap.TileLayer.prototype.getTileUrl方法
                if (window.AMap.TileLayer) {
                    window.AMap.TileLayer.prototype.getTileUrl = function(x, y, z) {
                        if (z > 12) z = 12;
                        return `/frontend/static/js/MAP_zxy/${z}/${x}/${y}.png`;
                    };
                }

                // 重写AMap.Map构造函数
                const originalMap = window.AMap.Map;
                window.AMap.Map = function(container, options) {
                    options = options || {};
                    options.layers = [];
                    options.features = ['bg', 'building'];
                    options.showRoad = false;
                    options.showTraffic = false;
                    options.showPOI = false;
                    options.showBuilding = false;
                    options.showIndoorMap = false;
                    options.showLabel = false;
                    options.offline = true;
                    options.zooms = [1, 12];
                    options.version = '2.0.1';
                    options.pluginDir = '/static/js/amap/mapsplugins/';
                    options.defaultLayer = false;
                    options.mapDir = '/static/js/amap/';
                    return new originalMap(container, options);
                };

                // 重写AMap.TileLayer构造函数
                const originalTileLayer = window.AMap.TileLayer;
                window.AMap.TileLayer = function(options) {
                    options = options || {};
                    options.getTileUrl = function(x, y, z) {
                        if (z > 12) z = 12;
                        return `/frontend/static/js/MAP_zxy/${z}/${x}/${y}.png`;
                    };
                    options.offline = true;
                    options.zooms = [1, 12];
                    options.version = '2.0.1';
                    options.mapDir = '/static/js/amap/';
                    return new originalTileLayer(options);
                };
                
                console.log('高德地图API加载完成');
                
                try {
                    // 初始化地图
                    await initMap();
                    console.log('地图初始化完成');
                    
                    // 设置地图相关事件
                    setupMapEvents();
                } catch (error) {
                    console.error('地图初始化失败:', error);
                    alert('地图初始化失败: ' + error.message);
                }
            } catch (error) {
                console.error('地图初始化失败:', error);
            }
        };

        // 退出登录
        document.getElementById('logout-btn').addEventListener('click', function() {
            // 清除登录状态
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            // 跳转到登录页
            window.location.href = '/login';
        });
    </script>
</body>
</html>
